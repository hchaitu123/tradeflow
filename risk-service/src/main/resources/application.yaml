server:
  port: 8081
spring:
  application:
    name: risk-service
  kafka:
    template:
      observation-enabled: true      # producer: write traceparent header
    listener:
      observation-enabled: true      # consumer: read traceparent header, continue
    bootstrap-servers: localhost:9092
    consumer:
      group-id: risk-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.chaitanya.tradeflow.risk.event.OrderCreatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true