server:
  port: 8081
account-service:
  url: http://account-service:8083          # ② account-service's port
spring:
  application:
    name: risk-service
  kafka:
    template:
      observation-enabled: true      # producer: write traceparent header
    listener:
      observation-enabled: true      # consumer: read traceparent header, continue
    bootstrap-servers: localhost:9092
    consumer:
      group-id: risk-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.chaitanya.tradeflow.risk.event.OrderCreatedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  http:
    clients:
      connect-timeout: 1s     # give up if we can't even reach it in 1 s
      read-timeout: 2s        # give up if it's connected but doesn't answer in 2 s
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:                     # ← new (2 spaces, same level as endpoint:)
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  health:                        # ← new
    circuitbreakers:
      enabled: true
resilience4j:                    # ← new, NO indent (top level)
  circuitbreaker:
    instances:
      account:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true