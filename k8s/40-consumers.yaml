apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: tradeflow
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092          # same as order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: tradeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: tradeflow/risk-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081                      # risk's server.port from Part B
          envFrom:
            - configMapRef:
                name: kafka-config                       # the shared ConfigMap above
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tradeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tradeflow/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082                      # notification's server.port
          envFrom:
            - configMapRef:
                name: kafka-config