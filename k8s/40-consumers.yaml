apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: tradeflow
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092          # same as order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-service
  namespace: tradeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-service
  template:
    metadata:
      labels:
        app: risk-service
    spec:
      containers:
        - name: risk-service
          image: tradeflow/risk-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081                      # risk's server.port from Part B
          envFrom:
            - configMapRef:
                name: kafka-config                       # the shared ConfigMap above
          env:
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:8083"          # ⑦ the K8s Service name
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10    # wait 10s after start before first check
            periodSeconds: 5           # then check every 5s
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3        # 3 fails in a row → restart the pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: tradeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: tradeflow/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082                      # notification's server.port
          envFrom:
            - configMapRef:
                name: kafka-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 10    # wait 10s after start before first check
            periodSeconds: 5           # then check every 5s
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3        # 3 fails in a row → restart the pod