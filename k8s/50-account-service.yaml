apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: tradeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: tradeflow/account-service:latest
          imagePullPolicy: Never          # see note ①
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 10    # wait 10s after start before first check
            periodSeconds: 5           # then check every 5s
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3        # 3 fails in a row → restart the pod
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: tradeflow
spec:
  type: ClusterIP      # ← here
  selector:
    app: account-service
  ports:
    - port: 8083
      targetPort: 8083