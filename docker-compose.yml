services:
  postgres:
    image: postgres:17
    container_name: tradeflow-postgres
    environment:
      POSTGRES_DB: tradeflow
      POSTGRES_USER: tradeflow
      POSTGRES_PASSWORD: tradeflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:4.1.0
    container_name: tradeflow-kafka
    ports:
      - "9092:9092"

volumes:
  pgdata:

