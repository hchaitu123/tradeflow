name: CI

on:
  push:
    branches: [ main ]          # ① which branch should be checked on every push?
  pull_request:
    branches: [ main ]          # every PR into main gets checked too

jobs:
  build:
    runs-on: ubuntu-latest               # ② GitHub's Linux machine (hint: ubuntu-…)
    steps:
      - uses: actions/checkout@v4          # copy the code onto the machine

      - uses: actions/setup-java@v4        # install Java
        with:
          distribution: temurin
          java-version: '21'             # ③ our Java version
          cache: maven                      # ④ which build tool's downloads to remember between runs

      - name: Build and test
        run: ./mvnw -B verify                # ⑤ the Maven phase that compiles + runs ALL tests
  docker:
    needs: build                       # ① which job must pass first?
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ order-service, risk-service, notification-service, account-service ] # ② our 3 service folder names
    steps:
      - uses: actions/checkout@v4

      - name: Build image ${{ matrix.service }}
        run: >
          docker build
          --build-arg SERVICE=${{ matrix.service }}
          -t tradeflow/${{ matrix.service }}:${{ github.sha }}
          .